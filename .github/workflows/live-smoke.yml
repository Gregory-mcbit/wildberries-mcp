name: live-smoke

on:
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Live read-only smoke test
        run: node live-smoke.mjs
        env:
          WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}
