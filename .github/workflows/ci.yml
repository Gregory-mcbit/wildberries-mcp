name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: YAML parser tests
        run: node test/yaml.test.mjs
      - name: Catalog builder tests
        run: node test/sync.test.mjs
      - name: MCP protocol + HTTP tests
        run: node test/mcp.test.mjs
      - name: GitHub publisher tests (mocked API)
        run: node test/publish.test.mjs
      - name: Package sanity tests
        run: node test/package.test.mjs
      - name: Offline catalog bundle tests
        run: node test/bundle.test.mjs
      - name: Doctor tests
        run: node test/doctor.test.mjs
      - name: Token encryption tests
        run: node test/tokenstore.test.mjs
      - name: MCP Bundle tests
        run: node test/mcpb.test.mjs
      - name: Deeplink tests
        run: node test/deeplinks.test.mjs
      - name: npm / MCP Registry metadata tests
        run: node test/npm-package.test.mjs
      - name: Account file id tests
        run: node test/accounts.test.mjs
      - name: Build catalog from sample specs
        run: node sync.mjs --from-dir test/specs-sample --out catalog-ci
      - name: Verify catalog structure and coverage
        run: node verify.mjs --catalog catalog-ci
